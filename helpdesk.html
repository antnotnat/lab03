<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Demonstrates some basic HTML form elements" />
  <meta name="keywords" content="HTML, Form, tags" />
  <meta name="author" content="A Lecturer"  />
  <title>HTML Form Example</title>
</head>
<body>
<img src="logo.png">
<h1>CWA Help Desk Appointment</h1>
<p> The help desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
<p> Check Blackboard for when CWA tutors will be here </p>
<form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
	<!--Note we have to use a special escape character to print an apostrophe on the Web page -->
	<p><label for="owner">Owner&apos;s Name</label> 
		<input type="text" name= "owner" id="owner" required="required"/>
	</p>
	<p><label for="email">Email</label> 
		<!--Use an HTML5 email control -->
      <input type="email" name= "email" id="email" required="required"/>
	</p>
	<fieldset>
		<legend>Student details</legend>
		<p><label for="studentid">Student ID</label> 
			<input type="text" name= "studentid" id="student" maxlength="20" size="10" required="required"/>
		</p>
        <p><label for="givenname">Given name</label> 
			<input type="text" name= "givenname" id="given" maxlength="20" size="10" required="required"/>
		</p>
        <p><label for="familyname">Family name</label> 
			<input type="text" name= "familyname" id="family" maxlength="20" size="10" required="required"/>
		</p>
    </fieldset>
		<fieldset>
			<legend>Your unit/legend</legend>
			<p><label for="cos10011">COS10011</label> 
				<input type="radio">
			</p>
			<p><label for="COS60004">COS60004</label> 
				<input type="radio">
			</p>
            <p><label for="COS60007">COS60007</label> 
				<input type="radio">
			</p>
        <p><label for="tutor">Your tutor</label> 
			<select name="breed" id="breed">
				<option value="a">Mr A</option>			
				<option value="b">Ms B</option>
				<option value="c">Mrs C</option>
			</select>
		</p>
		</fieldset>
		<fieldset>
			<legend>Issue</legend>
			<p><label for="HTML">HTML</label> 
				<input type="checkbox">
			</p>
			<p><label for="CSS">CSS</label> 
				<input type="checkbox">
			</p>
            <p><label for="JavaScript">JavaScript</label> 
				<input type="checkbox">
			</p>
            <p><label for="PHP">PHP</label> 
				<input type="checkbox">
			</p>
			<p><label for="SQL">SQL</label> 
				<input type="checkbox">
			</p>
            <!-- <p><label for="comments">Description of Issue</label> -->
            <p>Description of Issue</p>
			<textarea id="comments" name="comments"></textarea>
		</p>
		</fieldset>
        <p><label for="day">Preffered Day</label> 
			<input type="date">
		</p>
        <p><label for="time">Time</label>
            <input type="time">
            </p>
            <br>
	<input type= "submit" value="Book"/>
	<input type= "reset" value="Reset Form"/>
</form>
</body>
</html>
